# Property type filters
# Values: SFR, CONDO, TOWNHOUSE, MOBILE, LAND, MULTI-FAMILY, OTHER
property_types: []

# Price range (USD)
price:
  min: null
  max: 2000000

# Additional filters
filters:
  min_beds: null
  max_beds: null
  min_baths: null
  max_baths: null
  min_sqft: null
  max_sqft: null
  year_built_min: null
  year_built_max: null

# How many results per request (max 100)
page_size: 100

# Output settings
output:
  format: table  # json | csv | table
  file: null     # null = stdout, or path like "results.json"
