# ATTOM Explorer Configuration
# Docs: https://api.developer.attomdata.com/docs

# Search areas - ~20 minute commute radius from Palo Alto
search_areas:
  zips:
    Palo Alto: [94301, 94303, 94306]
    Menlo Park: [94025]
    Mountain View: [94040, 94041, 94043]
    Los Altos: [94022, 94024]
    Sunnyvale: [94085, 94086, 94087]
    Redwood City: [94061, 94063]
    Stanford: [94305]
    Portola Valley: [94028]
    Woodside: [94062]
    Atherton: [94027]
    Pacifica: [94044]

  # geo:
