# Househunter — unified search config
# Used by: pnpm start run

locations:
  - "Palo Alto, CA"
  - "Menlo Park, CA"
  - "Mountain View, CA"
  - "Los Altos, CA"
  - "Sunnyvale, CA"
  - "Redwood City, CA"
  - "Portola Valley, CA"
  - "Woodside, CA"
  - "Atherton, CA"
  - "Pacifica, CA"

search:
  home_status: FOR_SALE # FOR_SALE | FOR_RENT | RECENTLY_SOLD
  sort: NEWEST # DEFAULT | NEWEST | PRICE_LOW | PRICE_HIGH
  radius: 25 # miles from first commute address (coordinate search)

filters:
  min_beds: 2
  min_baths: 2
  max_price: 2000000
  home_types: # only keep these types (Zillow homeType values)
    - SINGLE_FAMILY

commute:
  max_minutes: 45 # target commute time
  max_miles: 25 # straight-line proxy (no routing API yet)
  addresses:
    - label: "Office — Palo Alto"
      address: "3000 Hanover Street, Palo Alto, CA"
      lat: 37.3957
      lng: -122.1467
    - label: "Office — Mountain View"
      address: "1045 La Avenida St, Mountain View, CA 94043"
      lat: 37.4016
      lng: -122.1109

output:
  format: table # json | csv | table
  file: null # null = stdout, or path like "results.json"

db:
  url: postgresql://househunter:househunter@localhost:5432/househunter
